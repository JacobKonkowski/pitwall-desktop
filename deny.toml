# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# In cargo-deny 0.20+, this selects *which* crates trigger unmaintained failures
# (not warn/deny). Tauri pulls unic-* / proc-macro-error transitively; only fail
# if a *workspace* crate itself is unmaintained.
unmaintained = "workspace"
yanked = "warn"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "0BSD",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Tauri / wry / gtk pull multiple semver-incompatible copies (base64, syn, …).
# Warn so the graph stays visible without failing CI on unavoidable duplicates.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
