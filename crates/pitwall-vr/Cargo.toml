[package]
name = "pitwall-vr"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "In-headset HUD for iRacing VR"

[dependencies]
pitwall-live = { path = "../pitwall-live" }
pitwall-settings = { path = "../pitwall-settings" }
anyhow = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Security",
] }
