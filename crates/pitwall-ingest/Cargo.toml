[package]
name = "pitwall-ingest"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "IBT file discovery, parsing, and import orchestration"

[dependencies]
pitwall-analysis = { path = "../pitwall-analysis" }
pitwall-storage = { path = "../pitwall-storage" }
pitwall-telemetry = { path = "../pitwall-telemetry" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
notify = "8"
parking_lot = "0.12"
pitwall = { version = "0.1", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
