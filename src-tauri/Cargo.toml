[package]
name = "pitwall-desktop"
version = "0.1.0"
description = "Post-session iRacing telemetry analysis"
authors = ["jrkon"]
license.workspace = true
edition = "2021"
default-run = "pitwall-desktop"

[lib]
name = "pitwall_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "gen-audio-clips"
path = "src/bin/gen_audio_clips.rs"

[features]
default = ["vr"]
# OpenXR layer packaging / native HUD paths. Disable for lighter contributor builds.
vr = []
# In-app updater (requires signing keys + endpoints — see docs/RELEASING.md).
updater = ["dep:tauri-plugin-updater"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", optional = true }
pitwall = { version = "0.1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hound = "3.5"

pitwall-telemetry = { path = "../crates/pitwall-telemetry" }
pitwall-analysis = { path = "../crates/pitwall-analysis" }
pitwall-settings = { path = "../crates/pitwall-settings" }
pitwall-storage = { path = "../crates/pitwall-storage" }
pitwall-ingest = { path = "../crates/pitwall-ingest" }
pitwall-live = { path = "../crates/pitwall-live" }
pitwall-audio = { path = "../crates/pitwall-audio" }
pitwall-vr = { path = "../crates/pitwall-vr" }
pitwall-monitor = { path = "../crates/pitwall-monitor" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Security",
    "Foundation",
    "Foundation_Collections",
    "Media_SpeechSynthesis",
    "Storage_Streams",
] }
